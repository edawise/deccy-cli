[package]
name = "deccy-cli"
version = "0.1.0"
edition = "2021"
description = "Maintain a decision graph in any repo: one CLI for humans and agents alike."
repository = "https://github.com/edawise/deccy-cli"
license = "MIT OR Apache-2.0"
keywords = ["jj", "decision-graph", "vcs", "cli", "agents"]
categories = ["command-line-utilities", "development-tools"]

# The command stays `deccy` while the package is `deccy-cli` (M-name).
[[bin]]
name = "deccy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.18"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
